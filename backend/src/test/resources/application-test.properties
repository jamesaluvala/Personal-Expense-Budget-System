# Tests default to H2 only. Set TEST_DB_* to use a dedicated disposable MySQL database in CI.
spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:budget_tests;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${TEST_DB_USER:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
server.servlet.session.cookie.secure=false
app.currency=INR
app.time-zone=UTC
logging.level.root=WARN
