spring.application.name=expense-budget
server.port=${PORT:8080}
# Use Railway private MySQL networking or another trusted private database network.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_budget?connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:expense_app}
spring.datasource.password=${DB_PASSWORD:expense123}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=LEDGER_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.path=/
server.tomcat.max-http-form-post-size=16KB
server.max-http-request-header-size=16KB
spring.servlet.multipart.enabled=false
app.currency=${APP_CURRENCY:INR}
app.time-zone=${APP_TIME_ZONE:Asia/Kolkata}
logging.level.org.springframework.security=WARN
